<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinTrack 💰</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <h1 class="title">FinTrack</h1>
      <img id="icon" src="media/money.png" alt="dinero" />
    </header>

    <section>
      <div class="menu">
        <div class="buttons">
          <button class="button-create">[ nuevo movimiento ]</button>
          <button class="button-filter">[ filtro de columnas ]</button>
        </div>

        <div class="filters">
          <fieldset>
            <input type="checkbox" id="tipo" />
            <label for="tipo">Tipo</label>

            <input type="checkbox" id="nombre" />
            <label for="nombre">Nombre</label>

            <input type="checkbox" id="cuenta" />
            <label for="cuenta">Cuenta</label>
          </fieldset>
        </div>
      </div>

      <article></article>

      <article class="movements-section">
        <table border="1" cellpadding="10" cellspacing="0" id="table">
          <thead>
            <tr id="columns">
              <!-- <th>ID</th>
              <th>Tipo</th>
              <th>Monto</th>
              <th>Fecha</th>
              <th>Categoría</th>
              <th>Método de Pago</th>
              <th>Cuenta</th>
              <th>Establecimiento</th>
              <th>Nombre</th>
              <th>Descripción</th> -->
            </tr>
          </thead>
          <tbody id="table_body">
            <!-- Aquí se insertan las filas (tr) con los datos (td) -->
          </tbody>
        </table>
      </article>
    </section>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
